  defensive: "생활필수품이라 불황에도 세제·기저귀·면도날 소비는 계속 → 방어적 현금흐름 = 70년 증배의 토대."
  simplification: "2010년대 중반 170개 → 65개 핵심 브랜드로 축소('fewer, bigger, better'). 수익성·집중도 개선."
  fy2025_read: "FY2025 매출 flat이지만 유기 +2%, 순이익 +7%, EPS +8% — 가격·믹스로 이익 성장. 물량은 약세(소비 둔화)."

