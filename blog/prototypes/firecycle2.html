var DRAW=2600, HOLD=1500, FADE=500, cur=-1;
function fmtManDollar(v){return (v/10000).toFixed(0)+'만';}
var g=document.getElementById('lines');
function partial(pts,prog){
  var n=pts.length,f=prog*(n-1),i=Math.floor(f),fr=f-i;
  if(i>=n-1){i=n-1;fr=0;}
  var d='M'+pts.slice(0,i+1).map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L');
  var cx=pts[i][0],cy=pts[i][1],cv=pts[i][2];
  if(i<n-1){cx=pts[i][0]+(pts[i+1][0]-pts[i][0])*fr;cy=pts[i][1]+(pts[i+1][1]-pts[i][1])*fr;cv=pts[i][2]+(pts[i+1][2]-pts[i][2])*fr;d+=' L'+cx.toFixed(1)+' '+cy.toFixed(1);}
  return {d:d,x:cx,y:cy,v:cv};
}
function build(ph){
  g.innerHTML='';
  document.getElementById('hline').setAttribute('y1',ph.hy);document.getElementById('hline').setAttribute('y2',ph.hy);
  var hl=document.getElementById('hlab');hl.setAttribute('y',ph.hy-7);hl.textContent='은퇴 원금 $'+(ph.init/10000)+'만';
  ph._el=ph.lines.map(function(l){
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','ln');p.style.stroke=l.c;
    var dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r',4);dot.style.fill=l.c;
    var t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','lab');t.style.fill=l.c;
    g.appendChild(p);g.appendChild(dot);g.appendChild(t);return {p:p,dot:dot,t:t,l:l};
  });
}
function draw(ph,prog){
  ph._el.forEach(function(e){
    var r=partial(e.l.pts,prog);
    e.p.setAttribute('d',r.d);e.dot.setAttribute('cx',r.x);e.dot.setAttribute('cy',r.y);
    e.t.setAttribute('x',Math.min(r.x+8,W-MR+4));e.t.setAttribute('y',r.y+4);
    e.t.textContent = (prog>=1 && !e.l.surv) ? e.l.end : ('$'+fmtManDollar(r.v));
  });
}
var start=null,phase=0,stage='draw';
function loop(ts){
  if(!start){start=ts;}
  var el=ts-start;
  if(stage==='draw'){
    var prog=Math.min(1,el/DRAW);draw(PHASES[phase],prog);
    if(prog>=1){stage='hold';start=ts;}
  } else if(stage==='hold'){
    if(el>HOLD){stage='fade';start=ts;}
  } else if(stage==='fade'){
    var o=Math.max(0,1-el/FADE);g.style.opacity=o;document.getElementById('cap').style.opacity=o;
    if(o<=0){phase=(phase+1)%PHASES.length;enter(phase);start=ts;stage='draw';}
  }
  requestAnimationFrame(loop);
}
function enter(i){
  g.style.opacity=1;document.getElementById('cap').style.opacity=1;
  document.getElementById('plab').textContent='$'+(PHASES[i].init/10000)+'만';
  document.getElementById('cap').textContent=CAPS[i];
  build(PHASES[i]);draw(PHASES[i],0);
}
window.addEventListener('load',function(){phase=0;enter(0);requestAnimationFrame(loop);});
