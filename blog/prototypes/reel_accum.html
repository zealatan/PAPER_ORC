function lab(t,v,x,y,txt,val){set(t,{x:x+10,y:y-6});document.getElementById(t).textContent=txt;set(v,{x:x+10,y:y+13});document.getElementById(v).textContent=val+' 달러';}
function frame(prog){var e=partial(EV,prog),p=partial(PR,prog),c=partial(CP,prog);
  set('pEval',{d:e.d});set('pPrin',{d:p.d});set('pCrash',{d:c.d});
  set('dEval',{cx:e.x,cy:e.y});set('dPrin',{cx:p.x,cy:p.y});set('dCrash',{cx:c.x,cy:c.y});
  lab('lEvalT','lEvalV',e.x,e.y-8,'적립 평가금액',fmt(e.v));
  lab('lPrinT','lPrinV',p.x,p.y+2,'적립 원금',fmt(p.v));
  lab('lCrashT','lCrashV',c.x,c.y+22,'폭락만 투입',fmt(c.v));
}
var start=null;
function run(ts){if(!start)start=ts;var el=ts-start;var prog=Math.min(1,el/DUR);frame(prog);
  if(prog<1)requestAnimationFrame(run);else setTimeout(function(){start=null;requestAnimationFrame(run);},PAUSE);}
window.addEventListener('load',function(){frame(0);requestAnimationFrame(run);});
</script></body></html>
