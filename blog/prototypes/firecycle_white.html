function X(y){return ML+(y-x0)/(x1-x0)*(W-ML-MR);}
function Y(v,ymax){return (H-MB)-v/ymax*(H-MB-MT);}
function niceStep(r){var e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;var n=f<=1?1:f<=2?2:f<=5?5:10;return n*e;}
function fmt(v){return '$'+(v/10000).toFixed(0)+'만';}
var SVGNS='http://www.w3.org/2000/svg';
function el(tag,attr){var e=document.createElementNS(SVGNS,tag);for(var k in attr)e.setAttribute(k,attr[k]);return e;}
function axes(ph){
  var ya=document.getElementById('yaxis');ya.innerHTML='';

  for(var v=step; v<=ph.ymax+1; v+=step){
    var y=Y(v,ph.ymax);

  }
  var xa=document.getElementById('xaxis');xa.innerHTML='';

    var t=el('text',{x:X(yr),y:H-MB+22,'class':'ax axx'});t.textContent=(yr==2000?'2000':'’'+String(yr).slice(2));xa.appendChild(t);
  });

var g=document.getElementById('lines');
function partial(pts,prog){var n=pts.length,f=prog*(n-1),i=Math.floor(f),fr=f-i;if(i>=n-1){i=n-1;fr=0;}
  var cx=pts[i][0],cy=pts[i][1];if(i<n-1){cx=pts[i][0]+(pts[i+1][0]-pts[i][0])*fr;cy=pts[i][1]+(pts[i+1][1]-pts[i][1])*fr;}
  return {arr:pts.slice(0,i+1),ex:cx,ey:cy};}
function build(ph){axes(ph);g.innerHTML='';
  var hy=Y(ph.init,ph.ymax);
  document.getElementById('hline').setAttribute('y1',hy);document.getElementById('hline').setAttribute('y2',hy);
  var hl=document.getElementById('hlab');hl.setAttribute('y',hy-7);hl.textContent='은퇴 원금 $'+ph.man+'만';

    var p=el('path',{'class':'ln'});p.style.stroke=l.c;
    var dot=el('circle',{r:4});dot.style.fill=l.c;
    var t=el('text',{'class':'lab'});t.style.fill=l.c;
    g.appendChild(p);g.appendChild(dot);g.appendChild(t);return {p:p,dot:dot,t:t,l:l};});}
function draw(ph,prog){ph._el.forEach(function(e){

  var d='M'+r.arr.map(function(q){return X(q[0]).toFixed(1)+' '+Y(q[1],ym).toFixed(1);}).join(' L');

var start=null,phase=0,stage='draw';

function loop(ts){if(!start)start=ts;var e=ts-start;
  if(stage==='draw'){var p=Math.min(1,e/DRAW);draw(PHASES[phase],p);if(p>=1){stage='hold';start=ts;}}

  requestAnimationFrame(loop);}
