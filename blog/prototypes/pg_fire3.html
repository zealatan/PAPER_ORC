    else{e.tt.textContent='';var _sd=e.side||'right';e.tv.setAttribute('text-anchor',_sd==='left'?'end':'start');e.tv.setAttribute('x',_sd==='left'?(ex-9):Math.min(ex+9,W-MR+2));e.tv.setAttribute('y',ey+6);/* 선 끝에 붙임 · 가까운 파산은 좌/우 분리 */e.tv.textContent=val;}
  });}
  var DUR=4200*(typeof PACE!=='undefined'?PACE:1),start=null;
  function run(ts){if(!svg.isConnected)return;if(!start)start=ts;var p=Math.min(1,(ts-start)/DUR);draw(p);if(p<1)requestAnimationFrame(run);}
  draw(0);requestAnimationFrame(run);
}
var EDIT=false,sel=null,drag=null;
function tagH(){['.hook','.rc-tk','.rc-per','.rc-logo','.rc-lg','.wm'].forEach(function(s){document.querySelectorAll(s).forEach(function(el){el.classList.add('ed-item');});});}
function selof(t){return t.closest('.ed-item');}function select(el){if(sel)sel.classList.remove('ed-sel');sel=el;if(sel)sel.classList.add('ed-sel');document.getElementById('edDel').disabled=!sel;}
function cxy(el){var m=(el.style.transform||'').match(/translate\(([-\d.]+)px[ ,]+([-\d.]+)px\)/);return m?[+m[1],+m[2]]:[0,0];}
document.addEventListener('pointerdown',function(e){if(!EDIT)return;var el=selof(e.target);if(!el)return;e.preventDefault();select(el);var b=cxy(el);drag={el:el,sx:e.clientX,sy:e.clientY,bx:b[0],by:b[1]};try{el.setPointerCapture(e.pointerId);}catch(_){}});
document.addEventListener('pointermove',function(e){if(!drag)return;drag.el.style.transform='translate('+(drag.bx+e.clientX-drag.sx)+'px,'+(drag.by+e.clientY-drag.sy)+'px)';});
document.addEventListener('pointerup',function(){drag=null;});
document.addEventListener('dblclick',function(e){if(!EDIT)return;var el=selof(e.target);if(!el)return;e.preventDefault();select(el);el.setAttribute('contenteditable','true');el.focus();var f=function(){el.removeAttribute('contenteditable');el.removeEventListener('blur',f);};el.addEventListener('blur',f);});
function delSel(){if(sel){sel.remove();sel=null;document.getElementById('edDel').disabled=true;}}
document.addEventListener('keydown',function(e){if(!EDIT||!sel)return;if((e.key==='Delete'||e.key==='Backspace')&&sel.getAttribute('contenteditable')!=='true'){e.preventDefault();delSel();}});
document.getElementById('edT').onclick=function(){EDIT=!EDIT;document.body.classList.toggle('editing',EDIT);this.textContent=EDIT?'✓ 편집 중':'✎ 편집';this.style.background=EDIT?'#ffd21f':'#2c3a52';this.style.color=EDIT?'#0a0f18':'#cfd8e6';document.getElementById('edDel').style.display=EDIT?'':'none';if(!EDIT)select(null);};
document.getElementById('edDel').onclick=delSel;
var svg=document.querySelector('.rc-chart'),hookEl=document.getElementById('hook'),stage=document.querySelector('.stage');
var idx=0,auto=true,timer=null,DUR=4200*PACE,HOLD=1500,THUMB_HOLD=2600,NSLIDE=FIRES.length+1;
function dots(){document.querySelectorAll('.pdot').forEach(function(d,k){d.classList.toggle('act',k===idx);});}
function playIdx(i){idx=(i+NSLIDE)%NSLIDE;
  var thumbEl=document.querySelector('.thumbslide'),shortsEl=document.querySelector('.shorts');
  if(timer)clearTimeout(timer);
  if(idx===0){   /* 슬라이드0 = 썸네일 */
    if(thumbEl)thumbEl.style.display='block'; if(shortsEl)shortsEl.style.display='none'; dots();
    if(auto)timer=setTimeout(function(){playIdx(1);},THUMB_HOLD); return; }
  if(thumbEl)thumbEl.style.display='none'; if(shortsEl)shortsEl.style.display='';
  var f=FIRES[idx-1];
  hookEl.innerHTML='은퇴원금 '+f.t2;   /* 간소화: 윗줄 제거, 한 줄 */
  applyChd();   /* 재생성된 훅 <b>($X0만)에 강조·메인색 재적용 */
  f.payload.yleft=true;
  svg.setAttribute('data-rc',JSON.stringify(f.payload));reelAnim(stage);dots();
  if(auto)timer=setTimeout(function(){playIdx(idx+1);},DUR+HOLD);}
function setPlayBtn(){document.getElementById('play').textContent=auto?'⏸ 자동재생':'▶ 자동재생';}
document.getElementById('prev').onclick=function(){auto=false;setPlayBtn();playIdx(idx-1);};
document.getElementById('next').onclick=function(){auto=false;setPlayBtn();playIdx(idx+1);};
document.getElementById('play').onclick=function(){auto=!auto;setPlayBtn();if(auto)playIdx(idx);else if(timer)clearTimeout(timer);};
/* PG 로고 + 옆 문구 위치·크기 숫자 조절 */
function gid(id){return document.getElementById(id);}
function applyChd(){
  var lo=document.querySelector('.rc-logo'), tx=document.querySelector('.rc-txt');
  var hk=document.getElementById('hook');
  if(lo){lo.style.height=gid('ls').value+'cqw';lo.style.transform='translate('+gid('lx').value+'cqw,'+gid('ly').value+'cqw)';}
  if(tx){tx.style.transformOrigin='left center';tx.style.transform='translate('+gid('tx').value+'cqw,'+gid('ty').value+'cqw) scale('+(gid('ts').value/100)+')';}
  if(hk){hk.style.transform='translate('+gid('hx').value+'cqw,'+gid('hy').value+'cqw)';hk.style.fontSize=gid('hs').value+'cqw';hk.style.color=gid('hc').value;var hb=hk.querySelector('b');if(hb)hb.style.color=gid('hbc').value;}
}
var CTRLKEYS=['lx','ly','ls','tx','ty','ts','hx','hy','hs','hc','hbc'];
CTRLKEYS.forEach(function(id){gid(id).addEventListener('input',applyChd);});
/* JSON 저장/불러오기 — .shorts 스냅샷(편집·위치·텍스트) + 컨트롤값 + 시나리오 */
document.getElementById('saveJson').onclick=function(){
  var c={};CTRLKEYS.forEach(function(id){c[id]=gid(id).value;});
  var data={v:1,idx:idx,controls:c,shorts:document.querySelector('.shorts').innerHTML};
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pg_fire3_layout.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
};
document.getElementById('loadJson').onclick=function(){gid('jsonf').click();};
gid('jsonf').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);
    if(d.controls){CTRLKEYS.forEach(function(k){if(d.controls[k]!=null&&gid(k))gid(k).value=d.controls[k];});}
    if(d.shorts!=null)document.querySelector('.shorts').innerHTML=d.shorts;
    svg=document.querySelector('.rc-chart');hookEl=document.getElementById('hook');stage=document.querySelector('.stage');
    idx=(typeof d.idx==='number'&&d.idx>0)?d.idx:1;   /* 스냅샷은 그래프 슬라이드 */
    var _t=document.querySelector('.thumbslide'),_s=document.querySelector('.shorts');
    if(_t)_t.style.display='none'; if(_s)_s.style.display='';
    tagH();auto=false;setPlayBtn();dots();if(timer)clearTimeout(timer);
    if(svg&&svg.getAttribute('data-rc'))reelAnim(stage);
  }catch(err){alert('불러오기 실패: '+err.message);}};
  r.readAsText(f);e.target.value='';};
tagH();applyChd();(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){playIdx(0);});
</script></body></html>
