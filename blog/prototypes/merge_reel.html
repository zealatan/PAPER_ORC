<script>
var PACE=1.0;

function reelAnim(root){
  var svg=root.querySelector('.rc-chart'); if(!svg) return;
  var cfg; try{ cfg=JSON.parse(svg.getAttribute('data-rc')); }catch(e){ return; }
  var W=960,H=540,ML=70,MR=176,MT=150,MB=66,x0=2000,x1=2026.6,YMAX=cfg.ymax;
  function X(y){return ML+(y-x0)/(x1-x0)*(W-ML-MR);}
  function Y(v){return (H-MB)-v/YMAX*(H-MB-MT);}
  function nstep(r){var e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;var n=f<=1?1:f<=2?2:f<=5?5:10;return n*e;}
  function fmt(v){return '$'+(v/10000).toFixed(0)+'만';}
  var NS='http://www.w3.org/2000/svg';
  function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
  var ya=svg.querySelector('.rc-yaxis'),xa=svg.querySelector('.rc-xaxis'),lg=svg.querySelector('.rc-lines');
  ya.innerHTML='';xa.innerHTML='';lg.innerHTML='';
  var step=nstep(YMAX/4);
  for(var v=step;v<=YMAX+1;v+=step){var y=Y(v);ya.appendChild(mk('line',{x1:ML,y1:y,x2:W-MR,y2:y,'class':'ytick'}));var t=mk('text',{x:ML-10,y:y+4,'class':'rc-ax rc-alL'});t.textContent=(v/10000)+'만';ya.appendChild(t);}
  [2000,2005,2010,2015,2020,2025].forEach(function(yr){var t=mk('text',{x:X(yr),y:H-MB+22,'class':'rc-ax rc-axx'});t.textContent=(yr==2000?'2000':'’'+String(yr).slice(2));xa.appendChild(t);});
  var ELS=cfg.lines.map(function(l){
    var g=mk('g',{'class':'rc-lgrp ed-item ed-svg'});
    var p=mk('path',{'class':'rc-ln'});p.style.stroke=l.c;if(l.dash)p.style.strokeDasharray='2 5';
    var dot=mk('circle',{r:4.5});dot.style.fill=l.c;
    var lab=mk('text',{'class':'rc-lab ed-item ed-svg '+(l.lab==='value'?'rc-labv':'rc-labn')});lab.style.fill=l.c;
    g.appendChild(p);g.appendChild(dot);g.appendChild(lab);lg.appendChild(g);
    return {g:g,p:p,dot:dot,lab:lab,l:l};});
  function partial(pts,prog){var n=pts.length,f=prog*(n-1),i=Math.floor(f),fr=f-i;if(i>=n-1){i=n-1;fr=0;}var cx=pts[i][0],cy=pts[i][1];if(i<n-1){cx=pts[i][0]+(pts[i+1][0]-pts[i][0])*fr;cy=pts[i][1]+(pts[i+1][1]-pts[i][1])*fr;}return {arr:pts.slice(0,i+1),ex:cx,ey:cy};}
  var SEG={0:[0.00,0.46],1:[0.54,1.00]};
  function draw(t){ELS.forEach(function(e){
    var sg=SEG[e.l.phase||0];var local=(t-sg[0])/(sg[1]-sg[0]);if(local<0)local=0;if(local>1)local=1;
    var vis=local>0.0006;e.g.style.opacity=vis?1:0;if(!vis)return;
    var r=partial(e.l.pts,local);
    var dd='M'+r.arr.map(function(q){return X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1);}).join(' L');
    var ex=X(r.ex),ey=Y(r.ey);
    e.p.setAttribute('d',dd+' L'+ex.toFixed(1)+' '+ey.toFixed(1));
    e.dot.setAttribute('cx',ex);e.dot.setAttribute('cy',ey);
    if(e.lab.dataset.edited)return;   // 사용자가 편집한 라벨은 덮어쓰지 않음
    var vstr=(local>=1&&!e.l.surv)?e.l.end:fmt(r.ey);
    e.lab.setAttribute('x',ex+10);e.lab.setAttribute('y',ey+(e.l.lab==='value'?6:4));
    e.lab.textContent=(e.l.lab==='value')?vstr:(e.l.name+' ('+vstr+')');
  });}
  var DUR=6000*(typeof PACE!=='undefined'?PACE:1),start=null;
  function run(ts){if(!svg.isConnected)return;if(!start)start=ts;var p=Math.min(1,(ts-start)/DUR);draw(p);if(p<1)requestAnimationFrame(run);else if(window.__afterAnim)window.__afterAnim();}
  draw(0);requestAnimationFrame(run);
}

function go(){ reelAnim(document.querySelector('.stage')); }
document.getElementById('replay').onclick=go;
(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){ requestAnimationFrame(go); });

/* ── 요소 편집기 (이동·삭제·수정) ── */
var EDIT=false, sel=null, drag=null;
var stage=document.querySelector('.stage'), chart=document.querySelector('.rc-chart');
function tagHtmlEditables(){
  ['.rc-title','.rc-tk','.rc-per','.rc-logo','.rc-lg'].forEach(function(s){
    stage.querySelectorAll(s).forEach(function(el){el.classList.add('ed-item');});
  });
}
tagHtmlEditables();
function svgScale(){ return chart.getBoundingClientRect().width/960; }
function isSvg(el){ return el.classList.contains('ed-svg'); }
function selof(t){ return t.closest('.ed-item'); }
function select(el){
  if(sel)sel.classList.remove('ed-sel');
  sel=el; if(sel)sel.classList.add('ed-sel');
  var db=document.getElementById('edDel'); if(db)db.disabled=!sel;
}
function curXY(el){
  if(isSvg(el)){var m=(el.getAttribute('transform')||'').match(/translate\(([-\d.]+)[ ,]+([-\d.]+)\)/);return m?[+m[1],+m[2]]:[0,0];}
  var m=(el.style.transform||'').match(/translate\(([-\d.]+)px[ ,]+([-\d.]+)px\)/);return m?[+m[1],+m[2]]:[0,0];
}
function setXY(el,x,y){
  if(isSvg(el)) el.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');
  else el.style.transform='translate('+x+'px,'+y+'px)';
}
stage.addEventListener('pointerdown',function(e){
  if(!EDIT)return; var el=selof(e.target); if(!el)return;
  e.preventDefault(); select(el);
  var b=curXY(el), sc=isSvg(el)?svgScale():1;
  drag={el:el,sx:e.clientX,sy:e.clientY,bx:b[0],by:b[1],sc:sc};
  el.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dx=(e.clientX-drag.sx)/drag.sc, dy=(e.clientY-drag.sy)/drag.sc;
  setXY(drag.el, drag.bx+dx, drag.by+dy);
});
stage.addEventListener('pointerup',function(e){ if(drag){try{drag.el.releasePointerCapture(e.pointerId);}catch(_){ }} drag=null; });
stage.addEventListener('dblclick',function(e){
  if(!EDIT)return; var el=selof(e.target); if(!el)return; e.preventDefault(); select(el);
  if(isSvg(el)){ var v=prompt('텍스트 수정', el.textContent); if(v!=null){el.textContent=v; el.dataset.edited='1';} }
  else { el.setAttribute('contenteditable','true'); el.focus();
    var fin=function(){el.removeAttribute('contenteditable');el.removeEventListener('blur',fin);};
    el.addEventListener('blur',fin); }
});
function delSel(){ if(sel){ sel.remove(); sel=null; var db=document.getElementById('edDel'); if(db)db.disabled=true; } }
document.addEventListener('keydown',function(e){
  if(!EDIT||!sel)return;
  if((e.key==='Delete'||e.key==='Backspace') && sel.getAttribute('contenteditable')!=='true'){ e.preventDefault(); delSel(); }
});
document.getElementById('edToggle').onclick=function(){
  EDIT=!EDIT; document.body.classList.toggle('editing',EDIT);
  this.textContent=EDIT?'✓ 편집 중':'✎ 편집';
  this.style.background=EDIT?'#ffd21f':'#2c3a52'; this.style.color=EDIT?'#0a0f18':'#cfd8e6';
  document.getElementById('edDel').style.display=EDIT?'':'none';
  if(!EDIT)select(null);
};
document.getElementById('edDel').onclick=delSel;
