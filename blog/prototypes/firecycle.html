<script>
var N=3,PHASE=3800,cur=-1;
function drawLines(g){[].forEach.call(g.querySelectorAll('.ln'),function(p){
  var L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;

  setTimeout(function(){[].forEach.call(g.querySelectorAll('.dot,.endlab'),function(e){e.style.opacity=1;});},1400);}
function resetLines(g){[].forEach.call(g.querySelectorAll('.ln'),function(p){p.style.transition='none';var L=p.getTotalLength();p.style.strokeDashoffset=L;});
  [].forEach.call(g.querySelectorAll('.dot,.endlab'),function(e){e.style.opacity=0;});}
function show(i){
  for(var k=0;k<N;k++){
    var g=document.getElementById('ph'+k),lb=document.getElementById('lab'+k),cp=document.getElementById('cap'+k);
    if(k===i){g.classList.add('on');lb.classList.add('on');cp.classList.add('on');drawLines(g);}
    else{g.classList.remove('on');lb.classList.remove('on');cp.classList.remove('on');resetLines(g);}
  }
}
function tick(){cur=(cur+1)%N;show(cur);}
window.addEventListener('load',function(){setTimeout(tick,400);setInterval(tick,PHASE);});
