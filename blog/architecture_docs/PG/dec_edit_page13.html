abled{opacity:.6}.subs h3{margin:0 0 4px;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.12em;color:#8a5a1a;text-transform:uppercase}.subs .cap{margin:0 0 14px;font-size:12.5px;color:#5c6d6b}.subs .lns{display:flex;flex-direction:column;gap:9px}.subs .ln{font-size:19px;line-height:1.55;font-weight:600;color:#17282a;border-left:4px solid #c98a1a;padding:11px 14px;border-radius:0 8px 8px 0;background:#fbf6ea;outline:none;cursor:text;transition:box-shadow .12s}.subs .ln:hover{background:#fdfaf0}.subs .ln:focus{background:#fff;box-shadow:inset 0 0 0 2px #c98a1a,0 2px 8px rgba(60,45,25,.12)}.subs .ln:empty:before{content:'(빈 줄 — 클릭해 입력)';color:#b7ae9c;font-weight:400}.subs .none{color:#8a9694;font-size:15px;font-style:italic}@media(max-width:820px){.work{flex-direction:column}.subs{flex:0 0 auto;max-height:38vh;border-left:0;border-top:1px solid #2c4144}}</style></head><body><div class="bar"><a class="home" href="dec_pipeline.html">← 파이프라인</a><span class="ttl"><span class="pn">13p</span> · 2부 전환 · 두 투자자 (매수법) <span style="color:#7f8f8d;font-weight:400">[sectint]</span></span><button class="save" id="bsave" title="이 편집을 소스에 저장하고 덱을 다시 굽는다">💾 저장(영구)</button><button class="reload" id="breload" title="localStorage 비우고 최신 구운 버전 로드">🔄 최신본</button><span class="nav"><a class="" href="dec_edit_page12.html">◀ 이전</a><a class="" href="dec_edit_page14.html">다음 ▶</a></span></div><div class="work"><iframe src="../../PG/deck/pg_v1.html?page=13&edit=1&stock=PG" title="deck page 13"></iframe><aside class="subs"><div class="hd"><h3>자막 · 13p</h3><span class="cap">문장을 직접 고치고 →</span><button class="svbtn" id="subsave">💾 자막 저장</button></div><div class="lns"><div class="ln" contenteditable="true">이번엔 반대로, 이제부터 모으는 입장입니다.</div><div class="ln" contenteditable="true">매달 천 달러씩 25년, 어떻게 사야 가장 크게 불릴까요?</div><div class="ln" contenteditable="true">두 투자자가 있습니다.</div></div></aside></div><script>var fr=document.querySelector("iframe"),bs=document.getElementById("bsave"),br=document.getElementById("breload");bs.onclick=function(){var w=fr.contentWindow;if(!w||!w.__pipelineSave){alert("덱이 아직 로드되지 않았습니다. 잠시 후 다시.");return;}bs.disabled=true;bs.textContent="저장 중…";w.__pipelineSave().then(function(r){bs.textContent=(r&&r.ok)?"✅ 저장+재굽기 완료":"⚠ 실패(콘솔확인)";if(!(r&&r.ok))console.warn("save-deck",r);setTimeout(function(){bs.textContent="💾 저장(영구)";bs.disabled=false;},2400);}).catch(function(e){bs.textContent="⚠ 오류";bs.disabled=false;console.error(e);});};br.onclick=function(){var w=fr.contentWindow;if(w&&w.__pipelineReload)w.__pipelineReload();else fr.src=fr.src;};var sv=document.getElementById("subsave");if(sv)sv.onclick=function(){var L=[].map.call(document.querySelectorAll(".subs .ln"),function(d){return d.textContent.replace(/\s+/g," ").trim();}).filter(Boolean);sv.disabled=true;sv.textContent="저장 중…(재굽기)";fetch("/api/save-subs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stock:"PG",scene:14,lines:L})}).then(function(r){return r.json();}).then(function(r){sv.textContent=(r&&r.ok)?"✅ 저장+재굽기 완료":"⚠ 실패(콘솔)";if(!(r&&r.ok))console.warn("save-subs",r);if(r&&r.ok)setTimeout(function(){fr.src=fr.src;},700);setTimeout(function(){sv.textContent="💾 자막 저장";sv.disabled=false;},2600);}).catch(function(e){sv.textContent="⚠ 오류";sv.disabled=false;console.error(e);});};</script></body></html>
